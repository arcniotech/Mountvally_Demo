name: Mountvalley iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Mountvalley for iOS
    runs-on: macos-15

    steps:
      # 1. Checkout GitHub Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 3. Install Dependencies
      - name: Install Dependencies
        run: npm ci

          - name: Build Website
        run: npm run build

      - name: Install iOS Dependencies
        run: npm install @capacitor/ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: Mountvalley-iOS
          path: build/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
          
