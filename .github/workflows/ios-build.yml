name: Mountvalley iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Mountvalley for iOS
    runs-on: macos-15

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Build Website
      - name: Build Website
        run: npm run build

      # Verify Existing iOS Platform
      - name: Verify iOS Platform
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            echo "ERROR: Existing iOS Xcode workspace not found."
            exit 1
          fi
          echo "Existing iOS project detected."

      # Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync ios

      # Check Xcode
      - name: Check Xcode
        run: xcodebuild -version

      # Build iOS Simulator
      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Upload Artifact
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: Mountvalley-iOS
          path: build/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
