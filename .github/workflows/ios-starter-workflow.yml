
name: Mount Valley iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-ios:
    name: Build Mount Valley iOS
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build

      - name: Install iOS Dependencies
        run: npm install @capacitor/ios

      - name: Verify iOS Platform
        run: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "ERROR: Existing iOS Xcode project not found."
            exit 1
          fi
          echo "Existing iOS project detected."

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Check Xcode
        run: xcodebuild -version

      - name: Build iOS Simulator Application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mount-Valley-iOS
          path: build/Build/Products/Release-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

